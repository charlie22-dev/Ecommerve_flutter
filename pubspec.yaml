name: my_app
description: "BookVerse — marketplace and reading tracker for manga, manhwa, manhua, comics, and light novels."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Backend (auth, Postgres, storage, realtime, edge functions)
  supabase_flutter: ^2.10.0

  # UI / assets
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Checkout
  webview_flutter: ^4.10.0
  http: ^1.2.2

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Logo and app mark (transparent PNGs). The launcher/web icons are
  # generated from the same artwork into each platform's own folders.
  assets:
    - assets/branding/

  # Display font (Anton, condensed/bold) and body font (Manrope) are loaded at
  # runtime via google_fonts (see lib/core/theme/app_typography.dart) rather
  # than bundled as raw asset files — no binary font files to ship or update.
